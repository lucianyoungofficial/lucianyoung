baseURL = "https://lucianyoung.cc"
locale = "zh-cn"
title = "Lucian Young"
theme = "PaperMod"

ignoreLogs = ['warning-goldmark-raw-html']

[markup.goldmark.renderer]
  unsafe = true

[params]
  # Homepage profile mode
  profileMode.enabled = true
  profileMode.title = "Lucian Young"
  profileMode.subtitle = "Vehicle Engineering Student\n\nA place to build, document and share."

  [[params.profileMode.buttons]]
    name = "GitHub"
    url = "https://github.com/lucianyoungofficial"

  # Reading & navigation
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowPostNavLinks = true

  # Minimal — no share buttons
  ShowShareButtons = false

  # Label next to site title
  label.text = "Lucian Young"

[menu]

[[menu.main]]
name = "Blog"
url = "/blog/"
weight = 10

[[menu.main]]
name = "Projects"
url = "/projects/"
weight = 20

[[menu.main]]
name = "Labs"
url = "/labs/"
weight = 30

[[menu.main]]
name = "About"
url = "/about/"
weight = 40
